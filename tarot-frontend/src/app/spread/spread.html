<h1>choose a spread:</h1>

<div class="spread-grid">

    <div *ngFor="let spread of spreads" (click)="selectSpread(spread)" [class.selected]="selectedSpread !== null && selectedSpread.id === spread.id" class="spread-card">
        <h2>{{ spread.name }}</h2>
        <p>{{ spread.intro }}</p>
        <ol *ngIf="spread.points">
            <li *ngFor="let point of spread.points">{{ point }}</li>
        </ol>
    </div>
</div>

<button (click)="goToQuestion()" [disabled]="!selectedSpread">ask your question</button>
